name: devbox

services:
  proxy:
    # Traefik v3.7 works with Docker Engine 29 (min API 1.40). Older v3.x
    # (incl. v3.5) forced/negotiated API 1.24, which Docker 29 rejects — the
    # Docker provider then can't read labels, so no routers register (404s).
    image: traefik:v3.7
    container_name: devbox_proxy
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect all plain HTTP to HTTPS.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt via TLS-ALPN-01 (needs public :443 + public DNS). No AWS creds.
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"   # dashboard, localhost only (reach via SSH tunnel)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./auth:/etc/traefik/auth:ro"        # htpasswd for basic auth (generated by up.sh)
      - "letsencrypt:/letsencrypt"           # persists issued certs (acme.json)
    networks:
      - web

  sw65:
    image: ${SW65_IMAGE}
    container_name: sw65
    restart: unless-stopped
    environment:
      - APP_URL=https://sw65-${DOMAIN_BASE}
      - XDEBUG_ENABLED=0
      # Route all outgoing mail to the Mailpit catcher (see mailpit service).
      - MAILER_DSN=smtp://mailpit:1025
    volumes:
      - "sw65_html:/var/www/html"
      - "sw65_db:/var/lib/mysql"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sw65.rule=Host(`sw65-${DOMAIN_BASE}`)"
      - "traefik.http.routers.sw65.entrypoints=websecure"
      - "traefik.http.routers.sw65.tls.certresolver=le"
      - "traefik.http.services.sw65.loadbalancer.server.port=80"
      - "traefik.http.middlewares.devbox-auth.basicauth.usersfile=/etc/traefik/auth/htpasswd"
      - "traefik.http.routers.sw65.middlewares=devbox-auth"
      # /api (JWT) and /store-api (access-key) authenticate themselves — bypass
      # basic auth via a higher-priority router (same backend, no middleware).
      - "traefik.http.routers.sw65-api.rule=Host(`sw65-${DOMAIN_BASE}`) && (PathPrefix(`/api`) || PathPrefix(`/store-api`))"
      - "traefik.http.routers.sw65-api.entrypoints=websecure"
      - "traefik.http.routers.sw65-api.tls.certresolver=le"
      - "traefik.http.routers.sw65-api.service=sw65"
      - "traefik.http.routers.sw65-api.priority=100"
    networks:
      - web

  sw66:
    image: ${SW66_IMAGE}
    container_name: sw66
    restart: unless-stopped
    environment:
      - APP_URL=https://sw66-${DOMAIN_BASE}
      - XDEBUG_ENABLED=0
      - MAILER_DSN=smtp://mailpit:1025
    volumes:
      - "sw66_html:/var/www/html"
      - "sw66_db:/var/lib/mysql"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sw66.rule=Host(`sw66-${DOMAIN_BASE}`)"
      - "traefik.http.routers.sw66.entrypoints=websecure"
      - "traefik.http.routers.sw66.tls.certresolver=le"
      - "traefik.http.services.sw66.loadbalancer.server.port=80"
      - "traefik.http.middlewares.devbox-auth.basicauth.usersfile=/etc/traefik/auth/htpasswd"
      - "traefik.http.routers.sw66.middlewares=devbox-auth"
      # /api (JWT) and /store-api (access-key) authenticate themselves — bypass
      # basic auth via a higher-priority router (same backend, no middleware).
      - "traefik.http.routers.sw66-api.rule=Host(`sw66-${DOMAIN_BASE}`) && (PathPrefix(`/api`) || PathPrefix(`/store-api`))"
      - "traefik.http.routers.sw66-api.entrypoints=websecure"
      - "traefik.http.routers.sw66-api.tls.certresolver=le"
      - "traefik.http.routers.sw66-api.service=sw66"
      - "traefik.http.routers.sw66-api.priority=100"
    networks:
      - web

  sw67:
    image: ${SW67_IMAGE}
    container_name: sw67
    restart: unless-stopped
    environment:
      - APP_URL=https://sw67-${DOMAIN_BASE}
      - XDEBUG_ENABLED=0
      - MAILER_DSN=smtp://mailpit:1025
    volumes:
      - "sw67_html:/var/www/html"
      - "sw67_db:/var/lib/mysql"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sw67.rule=Host(`sw67-${DOMAIN_BASE}`)"
      - "traefik.http.routers.sw67.entrypoints=websecure"
      - "traefik.http.routers.sw67.tls.certresolver=le"
      - "traefik.http.services.sw67.loadbalancer.server.port=80"
      - "traefik.http.middlewares.devbox-auth.basicauth.usersfile=/etc/traefik/auth/htpasswd"
      - "traefik.http.routers.sw67.middlewares=devbox-auth"
      # /api (JWT) and /store-api (access-key) authenticate themselves — bypass
      # basic auth via a higher-priority router (same backend, no middleware).
      - "traefik.http.routers.sw67-api.rule=Host(`sw67-${DOMAIN_BASE}`) && (PathPrefix(`/api`) || PathPrefix(`/store-api`))"
      - "traefik.http.routers.sw67-api.entrypoints=websecure"
      - "traefik.http.routers.sw67-api.tls.certresolver=le"
      - "traefik.http.routers.sw67-api.service=sw67"
      - "traefik.http.routers.sw67-api.priority=100"
    networks:
      - web

  # Static team launcher listing all environments (all platforms). Served by
  # Traefik at home-${DOMAIN_BASE}, behind the same basic auth + TLS.
  dashboard:
    image: nginx:alpine
    container_name: devbox_dashboard
    restart: unless-stopped
    volumes:
      - "./dashboard:/usr/share/nginx/html:ro"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`home-${DOMAIN_BASE}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=le"
      - "traefik.http.middlewares.devbox-auth.basicauth.usersfile=/etc/traefik/auth/htpasswd"
      - "traefik.http.routers.dashboard.middlewares=devbox-auth"
      - "traefik.http.services.dashboard.loadbalancer.server.port=80"
    networks:
      - web

  # Mail catcher for this box. Shopware (sw65/66/67) sends here via MAILER_DSN;
  # WooCommerce (wc1/2/3, woo-internal network) will send here too once its
  # mailer is wired (Phase 2). SMTP :1025 stays internal; the web UI :8025 is
  # exposed only through Traefik at mail2-${DOMAIN_BASE}, behind basic auth.
  # The Magento box (twint-dev-2) keeps its own separate Mailpit.
  mailpit:
    image: axllent/mailpit:latest
    container_name: devbox_mailpit
    restart: unless-stopped
    environment:
      - MP_DATABASE=/data/mailpit.db      # persist caught mail across restarts
      - MP_MAX_MESSAGES=5000
    volumes:
      - "mailpit_data:/data"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mail.rule=Host(`mail2-${DOMAIN_BASE}`)"
      - "traefik.http.routers.mail.entrypoints=websecure"
      - "traefik.http.routers.mail.tls.certresolver=le"
      - "traefik.http.middlewares.devbox-auth.basicauth.usersfile=/etc/traefik/auth/htpasswd"
      - "traefik.http.routers.mail.middlewares=devbox-auth"
      - "traefik.http.services.mail.loadbalancer.server.port=8025"
    networks:
      web:
        aliases: [mailpit]
      woo-internal:
        aliases: [mailpit]

volumes:
  sw65_html:
  sw65_db:
  sw66_html:
  sw66_db:
  sw67_html:
  sw67_db:
  letsencrypt:
  mailpit_data:

networks:
  web:
    external: false
  # Owned by the WooCommerce devbox compose (twint-woocommerce-extension); we
  # attach Mailpit to it so wc1/2/3 can reach mailpit:1025 (Phase 2 wiring).
  woo-internal:
    external: true
